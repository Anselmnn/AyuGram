# Project-wide Gradle settings.
# For more details see https://docs.gradle.org/current/userguide/build_environment.html

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://docs.gradle.org/current/userguide/multi_project_builds.html#sec:parallel_execution
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.enableJetifier=true

# Kotlin version
kotlin.version=1.9.20

# Compile SDK
android.compileSdk=36
android.minSdk=21
android.targetSdk=36

# Application Identity
APP_PACKAGE=com.tech.ayugram
APP_NAME=AyuGram
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1

# Official Telegram API keys
APP_ID=6
APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e

# Build config
BUILD_TYPE=debug
IS_DEBUG=true

# Signing (release keystore from GitHub Secrets - not in repo)
# RELEASE_KEYSTORE_PATH=
# RELEASE_KEYSTORE_PASSWORD=
# RELEASE_KEY_ALIAS=
# RELEASE_KEY_PASSWORD=

# CCache for NDK
org.gradle.caching=true

# Dependencies versions
deps {
    // Core
    gson = "2.11.0"
    
    // Firebase (messaging only)
    firebaseMessaging = "22.0.0"
    
    // ML Kit
    mlkitLanguageId = "17.0.0"
    
    // Google Play Services
    playServicesMaps = "18.2.0"
    playServicesCast = "21.4.0"
    playServicesCastFramework = "21.4.0"
    mediaRouter = "1.6.0"
    
    // Room Database
    roomVersion = "2.6.1"
    
    // MapLibre (for maps without GMS)
    maplibreVersion = "11.3.0"
    
    // OkHttp
    okhttpVersion = "4.12.0"
    
    // Lifecycle
    lifecycleVersion = "2.7.0"
    
    // WorkManager
    workManagerVersion = "2.9.0"
    
    // Biometric
    biometricVersion = "1.2.0-alpha04"
    
    // ExoPlayer
    exoplayerVersion = "2.19.1"
    
    // NanoHTTPD (for Cast)
    nanohttpdVersion = "2.3.1"
    
    // Crashlytics removed (R5)
    // Stripe removed (R22)
    // Billing removed (R22)
    // Wallet removed (R5)
    // Vision removed (R26)
    // Auth removed (R5)
    // Car removed (R20)
}