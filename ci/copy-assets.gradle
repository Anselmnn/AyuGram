// Copy assets and native libraries
task copyAssets(type: Copy) {
    from 'src/main/assets'
    into 'build/intermediates/merged_assets/debug/out'
}

task copyJniLibs(type: Copy) {
    from 'src/main/jniLibs'
    into 'build/intermediates/merged_jni_libs/debug/out'
}

afterEvaluate {
    tasks.named('mergeDebugAssets') { finalizedBy copyAssets }
    // mergeDebugJniLibs task may not exist - use mergeDebugNativeLibs instead
    def jniTask = tasks.findByName('mergeDebugJniLibs') ?: tasks.findByName('mergeDebugNativeLibs')
    if (jniTask) {
        jniTask.finalizedBy copyJniLibs
    }
}