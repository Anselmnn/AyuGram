# AyuGram CI — сборка на дереве DrKLO 12.10.3 (ветка plan-v2)
# План §9 «CI-архитектура», уточнение 04.10.2026 (v2.1 §14).
#
# Механика инкрементальной пересборки («только изменившиеся файлы»):
#  1) fetch-depth: 0 + submodules: recursive (pinned, fetch-depth 1)
#  2) Restore Git Timestamps — mtime каждого файла = время последнего коммита,
#     коснувшегося файла (суперпроект: полная история; сабмодули: mtime всех
#     файлов = время pinned-коммита — детерминировано по SHA, стабильно между
#     ранами). Без этого каждый checkout ставит mtime=now → полный ребилд нативки.
#  3) actions/cache: ~/.gradle (wrapper dists, зависимости, build-cache),
#     ~/android-sdk (SDK+NDK ~2.5G, лицензии), ~/.ccache (NDK C/C++/ASM),
#     TMessagesProj[.cxx|/build] + TMessagesProj_App[.cxx|/build] (состояние сборки).
#  4) ccache — страховочный слой для C/C++/ASM (env CMAKE_*_COMPILER_LAUNCHER).
#  5) org.gradle.caching=true (в gradle.properties) — Gradle build-cache:
#     неизменённые задачи — FROM-CACHE.
#
# Toolchain = дерево DrKLO: Gradle 8.13 (wrapper репо), AGP 8.13.2, JDK 17,
# compileSdk 36 / build-tools 36.0.0 / NDK 27.2.12479018 / CMake 3.22.1.
#
# Кеш сохраняется с if: always() — упавшая сборка оставляет частичный кеш.

name: Build AyuGram

on:
  workflow_dispatch:
  push:
    branches: [plan-v2]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: $HOME/android-sdk

jobs:
  build-debug:
    name: Assemble Debug (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository (full history + pinned submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          submodule-fetch-depth: 1

      - name: Restore Git Timestamps
        run: |
          python3 - <<'EOF'
          import subprocess, os
          ws = os.environ["GITHUB_WORKSPACE"]

          def apply_log(repo, root):
              out = subprocess.check_output(
                  ["git", "log", "--name-only", "--pretty=format:%ct"], cwd=repo
              ).decode("utf-8", "replace")
              cur, seen = None, set()
              for line in out.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.isdigit():
                      cur = int(line)
                  elif cur is not None and line not in seen:
                      seen.add(line)
                      p = os.path.join(root, line)
                      if os.path.exists(p):
                          try:
                              os.utime(p, (cur, cur))
                          except Exception:
                              pass

          # суперпроект: полная история (fetch-depth 0)
          apply_log(ws, ws)

          # сабмодули (pinned, shallow): mtime всего содержимого = время pinned-коммита
          out = subprocess.check_output(
              ["git", "config", "--file", ".gitmodules", "--get-regexp", r"submodule\..*\.path"],
              cwd=ws,
          ).decode("utf-8")
          for line in out.splitlines():
              sub = line.split()[-1]
              if not os.path.isdir(os.path.join(ws, sub, ".git")) and not os.path.isfile(os.path.join(ws, sub, ".git")):
                  continue
              ts = int(subprocess.check_output(
                  ["git", "log", "-1", "--format=%ct", "--", sub], cwd=ws
              ).decode().strip())
              for dirpath, dirnames, filenames in os.walk(os.path.join(ws, sub)):
                  try:
                      os.utime(dirpath, (ts, ts))
                      for f in filenames:
                          os.utime(os.path.join(dirpath, f), (ts, ts))
                  except Exception:
                      pass
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ~/android-sdk
          key: ayugram-sdk-36-ndk-27.2-bt-36-cmake-3.22.1

      - name: Install Android SDK / NDK / CMake
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Cache Gradle (wrapper + caches)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ayugram-gradle-8.13-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ayugram-gradle-8.13-

      - name: Cache native build state + Gradle build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build
            TMessagesProj_App/.cxx
            TMessagesProj_App/build
          key: ayugram-native-build-${{ github.run_id }}
          restore-keys: |
            ayugram-native-build-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ayugram-ccache-${{ github.run_id }}
          restore-keys: |
            ayugram-ccache-

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Build (assembleDebug)
        env:
          CCACHE_DIR: $HOME/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: '1'
          CCACHE_DEPEND: '1'
          CCACHE_MAXSIZE: 8G
          CCACHE_SLOPPINESS: include_file_mtime,time_macros,include_file_ctime,file_macro,line_macro
          CCACHE_COMPILERCHECK: content
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_ASM_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug --stacktrace --no-watch-fs

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayugram-debug
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Save native build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build
            TMessagesProj_App/.cxx
            TMessagesProj_App/build
          key: ayugram-native-build-${{ github.run_id }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ayugram-ccache-${{ github.run_id }}
