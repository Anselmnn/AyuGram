plugins {
    id 'com.android.application' version '8.3.0'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.tech.ayugram'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.tech.ayugram"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        
        // Multi-dex enabled for large codebase
        multiDexEnabled true
        
        // Vector drawables support
        vectorDrawables.useSupportLibrary = true
        
        // Java 8 compatibility
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        
        // Build config fields
        buildConfigField "String", "APP_PACKAGE", "\"com.tech.ayugram\""
        buildConfigField "String", "APP_NAME", "\"AyuGram\""
        buildConfigField "int", "APP_VERSION_CODE", "1"
        buildConfigField "String", "APP_VERSION_NAME", "\"1.0.0\""
        buildConfigField "int", "APP_API_ID", "6"
        buildConfigField "String", "APP_API_HASH", "\"eb06d4abfb49dc3eeb1aeb98ae0f581e\""
        buildConfigField "boolean", "IS_DEBUG", "true"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Configured via GitHub Actions Secrets (Phase 8)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            
            // Preserve line numbers for debugging
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled false  // No obfuscation per R6
            shrinkResources false
            signingConfig signingConfigs.release
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
            "-Xopt-in=kotlin.RequiresOptIn",
            "-Xopt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        ]
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so'
            ]
        }
    }

    // Source sets
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // ============ CORE ============
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.fragment:fragment:1.6.2"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.collection:collection:1.4.0"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation "com.google.guava:listenablefuture:1.0"

    // ============ JSON ============
    implementation "com.google.code.gson:gson:2.11.0"

    // ============ MATERIAL COMPONENTS ============
    implementation "com.google.android.material:material:1.12.0"

    // ============ FIREBASE (Messaging only - R5) ============
    implementation "com.google.firebase:firebase-messaging:22.0.0"

    // ============ ML KIT (Language ID - R12) ============
    implementation "com.google.mlkit:language-id:17.0.0"

    // ============ GOOGLE PLAY SERVICES ============
    // Maps (R17) - hybrid: GMS -> Google, else MapLibre
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    
    // Cast stack (R2) - keep
    implementation "com.google.android.gms:play-services-cast:21.4.0"
    implementation "com.google.android.gms:play-services-cast-framework:21.4.0"
    implementation "androidx.mediarouter:mediarouter:1.6.0"

    // ============ ROOM DATABASE (for AyuGram features) ============
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    // ============ MAPLIBRE (for maps without GMS - R17) ============
    implementation "org.maplibre.gl:android-sdk:11.3.0"

    // ============ OKHTTP ============
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // ============ WORKMANAGER ============
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // ============ BIOMETRIC ============
    implementation "androidx.biometric:biometric:1.2.0-alpha04"

    // ============ EXOPLAYER ============
    def exoplayerVersion = "2.19.1"
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-dash:$exoplayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exoplayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-smoothstreaming:$exoplayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-rtsp:$exoplayerVersion"

    // ============ NANOHTTPD (for Cast - R2) ============
    implementation "org.nanohttpd:nanohttpd:2.3.1"

    // ============ ANNOTATION PROCESSORS ============
    kapt "androidx.annotation:annotation:1.7.0"

    // ============ TEST ============
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"

    // ============ REMOVED (per PLAN.md) ============
    // Firebase Analytics/Crashlytics/AppIndexing/DataTransport - R5
    // implementation "com.google.firebase:firebase-analytics"
    // implementation "com.google.firebase:firebase-crashlytics"
    // implementation "com.google.firebase:firebase-appindexing"
    // implementation "com.google.firebase:firebase-datatransport"
    // implementation "com.google.firebase:firebase-config"
    
    // Stripe - R22
    // implementation "com.stripe:stripe-android:20.2.0"
    
    // Billing - R22
    // implementation "com.android.billingclient:billing:8.0.0"
    
    // Wallet - R5
    // implementation "com.google.android.gms:play-services-wallet:19.2.0"
    
    // Vision - R26
    // implementation "com.google.android.gms:play-services-vision:20.1.3"
    
    // Auth (Google Sign-In) - R5
    // implementation "com.google.android.gms:play-services-auth:20.7.0"
    
    // Car - R20
    // implementation "androidx.car.app:app:1.5.0"
    
    // libgsaverification - E6
    // implementation files('libs/libgsaverification-client.aar')
}

apply from: '../ci/copy-assets.gradle'